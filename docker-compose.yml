services:
  edgebot-bot:
    image: ghcr.io/cesto93/edgebot:latest
    container_name: edgebot-bot
    command: ["bot"]
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Persist config, usage stats, KV store and model/lib caches
      - edgebot-config:/root/.config/edgebot
      - edgebot-data:/root/.edgebot
    env_file:
      - .env
    environment:
      # When Ollama runs on the host, point the container at host.docker.internal.
      # Override with OLLAMA_HOST in your .env if needed.
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  edgebot-config:
  edgebot-data:
