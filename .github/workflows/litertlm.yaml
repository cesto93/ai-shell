name: Build LiteRT-LM Shared Libraries

on:
  workflow_dispatch:
    inputs:
      litert_tag:
        description: 'Tag o Commit di LiteRT-LM da compilare'
        required: true
        default: 'main'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LiteRT-LM upstream
        uses: actions/checkout@v5
        with:
          repository: google-ai-edge/LiteRT-LM
          ref: ${{ github.event.inputs.litert_tag }}
          submodules: recursive
          # Fetch prebuilt .so binaries stored in Git LFS (else they appear as
          # text pointers and the linker fails with "unknown directive: version").
          lfs: true

      - name: Setup Bazel (with cache)
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazel-version: 7.x
          # Avoid re-downloading the Bazel distribution on every run.
          bazelisk-cache: true
          # Cache compiled build outputs (marked by BUILD file contents) across runs.
          disk-cache: ${{ github.workflow }}
          # Cache external dependencies (LLVM/XNNPACK/etc. downloads) across runs.
          repository-cache: true

      - name: Cache zlib tarball for Bazel distdir
        uses: actions/cache@v4
        id: zlib-cache
        with:
          path: distdir
          key: zlib-1.3.1

      - name: Pre-fetch zlib into Bazel distdir
        if: steps.zlib-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p distdir
          curl -fsSL -o distdir/zlib-1.3.1.tar.gz https://zlib.net/fossils/zlib-1.3.1.tar.gz
          echo "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  distdir/zlib-1.3.1.tar.gz" | sha256sum -c -

      - name: Build C-API Shared Library
        run: |
          # Target C-API presente nel repository LiteRT-LM corrente (directory c/), produce liblitert-lm.so
          # --distdir usa zlib scaricato localmente, evitando il download non affidabile da zlib.net
          # --config=public_cache usa il remote cache READ-ONLY pubblico di LiteRT-LM, così da scaricare
          # gli artefatti linux-x86_64 già compilati da Google invece di ricompilarli da zero.
          bazel build --config=public_cache --distdir="$(pwd)/distdir" -c opt //c:litert-lm

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: litert-lm-linux-amd64
          path: |
            bazel-bin/c/liblitert-lm.so